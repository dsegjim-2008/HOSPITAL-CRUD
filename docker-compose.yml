version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: crud_users
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_client
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@empresa.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: spring_server
    ports:
      - "8081:8080"
    depends_on:
      - db
    volumes:
      - ./server:/app # Sincroniza tu código local con el contenedor
    environment:
      - SPRING_PROFILES_ACTIVE=dev

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: react_client
    ports:
      - "5173:5173" # Puerto por defecto de Vite
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules # Evita sobreescribir los módulos de node del contenedor con los locales

volumes:
  postgres_data:
  pgadmin_data: